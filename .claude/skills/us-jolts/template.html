<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美國職缺 JOLTS</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1f22; --muted: #6b6f76; --line: #e2e2dc; --line-strong: #c9c9c1;
  --head: #eeeee8; --accent: #2f5d8a; --neg: #b3261e;
  --hot: 232, 120, 40;   /* private supersector top 3 in the month */
  --cold: 70, 150, 90;   /* bottom 3 */
  --rowhover: #f3f6fa;
  }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --ink: #e6e6e3; --muted: #9a9ea6; --line: #2c3036; --line-strong: #3b4048;
    --head: #24282d; --accent: #8db8e0; --neg: #ff8a80; --rowhover: #23282f;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --ink: #e6e6e3; --muted: #9a9ea6; --line: #2c3036; --line-strong: #3b4048;
  --head: #24282d; --accent: #8db8e0; --neg: #ff8a80; --rowhover: #23282f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1600px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 12.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; max-width: 1600px; margin: 0 auto; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > span { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
button.seg { border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); padding: 4px 10px;
  border-radius: 6px; font: inherit; font-size: 12.5px; cursor: pointer; }
button.seg:hover { border-color: var(--accent); }
button.seg[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
label.chk { font-size: 12.5px; display: flex; gap: 4px; align-items: center; cursor: pointer; }
.wrap { max-width: 1600px; margin: 0 auto 32px; padding: 0 16px; }
.scroller { overflow: auto; max-height: calc(100vh - 150px); border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); }
table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; min-width: 100%; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--head); font-weight: 600; font-size: 12.5px;
  border-bottom: 1px solid var(--line-strong); text-align: right; }
thead tr.grp th { top: 0; text-align: center; font-weight: 600; color: var(--muted); }
thead tr.cols th { top: 27px; }
th.name, td.name { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; border-right: 1px solid var(--line-strong); min-width: 300px; }
thead th.name { z-index: 3; background: var(--head); }
td.num { text-align: right; min-width: 64px; }
td.sep, th.sep { border-left: 1px solid var(--line-strong); }
tbody tr:hover td { background-color: var(--rowhover); }
tbody tr:hover td.heat { filter: brightness(0.97); }
td.neg { color: var(--neg); }
.lv0 td { font-weight: 700; } .lv1 td { font-weight: 700; border-top: 1px solid var(--line-strong); }
.lv0 td { border-top: 1px solid var(--line-strong); }
.caret { display: inline-block; width: 16px; text-align: center; cursor: pointer; color: var(--muted); user-select: none; }
.caret.leaf { cursor: default; }
.zh { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
.hide-zh .zh { display: none; }
th .p { color: var(--accent); font-weight: 700; margin-left: 2px; }
.legend { color: var(--muted); font-size: 12px; padding: 8px 2px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 640px) { th.name, td.name { min-width: 190px; } .zh { display: none; } }
.cards { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1600px; margin: 0 auto; padding: 4px 16px 0; }
.card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; min-width: 150px; }
.card .k { color: var(--muted); font-size: 12px; }
.card .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.card .d .neg { color: var(--neg); }
</style>
</head>
<body>
<header>
  <h1>美國職缺與勞動流動（JOLTS）產業別</h1>
  <div class="sub" id="meta"></div>
</header>
<div class="cards" id="cards"></div>
<div class="controls">
  <div class="group" id="elemBtns"><span>指標</span></div>
  <div class="group" id="viewBtns"><span>數值</span></div>
  <div class="group" id="levelBtns"><span>展開至</span></div>
  <div class="group">
    <label class="chk"><input type="checkbox" id="heat" checked> 民間超級產業前/後 3 名上色</label>
    <label class="chk"><input type="checkbox" id="showZh" checked> 中文名稱</label>
  </div>
</div>
<div class="wrap">
  <div class="scroller"><table id="tbl"></table></div>
  <div class="legend">
    <span><span class="sw" style="background:rgba(var(--hot),.45)"></span>該月民間超級產業（L2）數值最高前 3 名</span>
    <span><span class="sw" style="background:rgba(var(--cold),.45)"></span>最低 3 名</span>
    <span>（水準檢視不排名，因為只反映產業大小；同值並列）</span>
    <span>正數黑字、<span style="color:var(--neg)">負數紅字</span></span>
    <span>比率 = 該指標 ÷ 就業人數（職缺率的分母是就業 + 職缺）</span>
    <span><b style="color:var(--accent)">P</b> 初值（preliminary），下個月會修正</span>
    <span>點擊產業名稱前的 ▸ / ▾ 可個別展開或收合</span>
  </div>
</div>
<script>
const DATA = /*__JOLTS_DATA__*/null;

const VIEWS = {
  level: "水準 (千人)", mom: "MoM 變化 (千人)", avg3: "3個月平均 (千人)", rate: "比率 (%)", rchg: "比率 MoM 變化 (pp)",
};
// Yearly columns: annual average for level-type views, Dec-to-Dec change for change views.
const YEARLY = {
  level: "年平均 (千人)", avg3: "年平均 (千人)", rate: "年平均比率 (%)",
  mom: "年度變化 (千人，12 月對前一年 12 月)", rchg: "年度比率變化 (pp，12 月對前一年 12 月)",
};
const DEC = { level: 0, mom: 0, avg3: 0, rate: 1, rchg: 1 };
const LEVEL_NAMES = ["總數", "民間 / 政府", "超級產業", "細產業"];
const state = { el: "JO", view: "level", heat: true, collapsed: new Set() };

function ymPrev(ym, n = 1) {
  let [y, m] = ym.split("-").map(Number);
  m -= n; while (m <= 0) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, "0")}`;
}
const fmt = (v, d = 0, sign = false) => {
  if (v == null || Number.isNaN(v)) return "";
  const r = Math.round(v * 10 ** d) / 10 ** d || 0;   // avoid "-0"
  const s = r.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  return sign && r > 0 ? "+" + s : s;
};
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

function prepare() {
  const rows = DATA.rows;
  const byId = Object.fromEntries(rows.map(r => [r.code, r]));
  rows.forEach(r => { r.children = rows.filter(c => c.parent === r.code).map(c => c.code); });
  const total = rows[0];
  const allMonths = Object.keys(total.data.JO.level).sort();
  const months = allMonths.filter(m => m >= DATA.start).reverse();   // newest first
  const latest = months[0];
  const prelim = new Set(DATA.prelim || []);
  const firstYear = +(DATA.annual_from || DATA.start.slice(0, 4));
  const years = [];
  for (let y = +latest.slice(0, 4); y >= firstYear; y--) years.push(String(y));
  const underPrivate = r => { for (let p = r.parent; p; p = byId[p].parent) if (p === "100000") return true; return false; };
  rows.forEach(r => {
    r.ranked = r.level === 2 && underPrivate(r);
    r.v = {}; r.y = {};
    DATA.elements.forEach(({ code }) => {
      const L = r.data[code].level, R = r.data[code].rate;
      const v = { level: {}, mom: {}, avg3: {}, rate: {}, rchg: {} };
      months.forEach(m => {
        const p = ymPrev(m), p3 = ymPrev(m, 3);
        if (L[m] != null) v.level[m] = L[m];
        if (R[m] != null) v.rate[m] = R[m];
        if (L[m] != null && L[p] != null) v.mom[m] = L[m] - L[p];
        if (R[m] != null && R[p] != null) v.rchg[m] = R[m] - R[p];
        const last3 = [m, p, ymPrev(m, 2)].map(x => L[x]);
        if (last3.every(x => x != null)) v.avg3[m] = mean(last3);
      });
      const y = { level: {}, avg3: {}, rate: {}, mom: {}, rchg: {} };
      years.forEach(yr => {
        const inYear = ser => Object.keys(ser).filter(m => m.startsWith(yr)).sort();
        const lm = inYear(L), rm = inYear(R);
        if (lm.length) y.level[yr] = y.avg3[yr] = mean(lm.map(m => L[m]));
        if (rm.length) y.rate[yr] = mean(rm.map(m => R[m]));
        const base = `${+yr - 1}-12`, last = lm[lm.length - 1];
        if (last && L[base] != null) y.mom[yr] = L[last] - L[base];
        if (last && R[last] != null && R[base] != null) y.rchg[yr] = R[last] - R[base];
      });
      r.v[code] = v; r.y[code] = y;
    });
  });
  // Per element / view / month: cutoffs for the top 3 and bottom 3 private supersectors.
  const ranked = rows.filter(r => r.ranked);
  const rank = {};
  DATA.elements.forEach(({ code }) => {
    rank[code] = {};
    ["mom", "avg3", "rate", "rchg"].forEach(k => {
      rank[code][k] = {};
      months.forEach(m => {
        const vals = ranked.map(r => r.v[code][k][m]).filter(v => v != null).sort((a, b) => b - a);
        if (vals.length >= 6) rank[code][k][m] = { hi: vals[2], lo: vals[vals.length - 3] };
      });
    });
  });
  return { rows, byId, months, latest, prelim, years, rank, partial: latest.slice(5) !== "12" };
}

function heatStyle(ctx, r, m, v) {
  if (!state.heat || !r.ranked || v == null || state.view === "level") return "";
  const cut = ctx.rank[state.el][state.view][m];
  if (!cut) return "";
  // Compare at display precision so ties in what is shown get the same color.
  const d = DEC[state.view], rd = x => Math.round(x * 10 ** d);
  if (rd(v) >= rd(cut.hi)) return "background-color:rgba(var(--hot),.45)";
  if (rd(v) <= rd(cut.lo)) return "background-color:rgba(var(--cold),.45)";
  return "";
}

function isVisible(r, ctx) {
  let p = r.parent;
  while (p) { if (state.collapsed.has(p)) return false; p = ctx.byId[p].parent; }
  return true;
}

function renderCards(ctx) {
  const t = ctx.rows[0], m = ctx.latest, p = ymPrev(m);
  let h = "";
  DATA.elements.forEach(({ code, zh }) => {
    const L = t.data[code].level, R = t.data[code].rate;
    const d = L[m] != null && L[p] != null ? L[m] - L[p] : null;
    const dr = R[m] != null && R[p] != null ? R[m] - R[p] : null;
    h += `<div class='card'><div class='k'>${zh} ${m.replace("-", "/")}${ctx.prelim.has(m) ? " P" : ""}</div>` +
      `<div class='v'>${fmt(L[m] / 1000, 2)}M <span style='font-size:13px;font-weight:600'>${fmt(R[m], 1)}%</span></div>` +
      `<div class='d'>MoM <span class='${d != null && Math.round(d) < 0 ? "neg" : ""}'>${fmt(d, 0, true)}k</span>，` +
      `比率 <span class='${dr != null && Math.round(dr * 10) < 0 ? "neg" : ""}'>${fmt(dr, 1, true)}pp</span></div></div>`;
  });
  const U = DATA.unemployed || {}, J = t.data.JO.level;
  const vu = x => U[x] != null && J[x] ? U[x] / J[x] : null;
  const prevVu = [1, 3, 12].map(n => ymPrev(m, n)).map(x => `${x.replace("-", "/")} ${fmt(vu(x), 2) || "—"}`);
  h += `<div class='card'><div class='k'>失業人數 ÷ 職缺 ${m.replace("-", "/")}</div><div class='v'>${fmt(vu(m), 2)}</div>` +
       `<div class='d'>${prevVu.join("｜")}</div></div>`;
  document.getElementById("cards").innerHTML = h;
}

function render(ctx) {
  const { rows, months, prelim, years, latest } = ctx;
  const el = state.el, view = state.view, dec = DEC[view];
  const elName = DATA.elements.find(e => e.code === el);
  let h = "<thead><tr class='grp'><th class='name'></th><th colspan='2'>最新 " + latest.replace("-", "/") + "</th>";
  h += `<th class='sep' colspan='${months.length}'>${elName.zh}｜${VIEWS[view]}</th>`;
  h += `<th class='sep' colspan='${years.length}'>${YEARLY[view]}</th></tr>`;
  h += "<tr class='cols'><th class='name'>產業</th><th>水準 (千)</th><th>比率</th>";
  months.forEach((m, i) => {
    h += `<th class='${i === 0 ? "sep" : ""}'>${m.replace("-", "/")}${prelim.has(m) ? "<span class='p' title='preliminary 初值'>P</span>" : ""}</th>`;
  });
  years.forEach((y, i) => {
    const part = y === latest.slice(0, 4) && ctx.partial;
    h += `<th class='${i === 0 ? "sep" : ""}'>${y}${part ? " YTD" : ""}</th>`;
  });
  h += "</tr></thead><tbody>";
  rows.forEach(r => {
    if (!isVisible(r, ctx)) return;
    const caret = r.children.length ? `<span class='caret' data-id='${r.code}'>${state.collapsed.has(r.code) ? "▸" : "▾"}</span>`
                                    : "<span class='caret leaf'></span>";
    const d = r.data[el];
    h += `<tr class='lv${r.level}' title='${r.code}'>`;
    h += `<td class='name' style='padding-left:${8 + r.level * 18}px'>${caret}${r.en}<span class='zh'>${r.zh}</span></td>`;
    h += `<td class='num'>${fmt(d.level[latest])}</td><td class='num'>${d.rate[latest] != null ? fmt(d.rate[latest], 1) + "%" : ""}</td>`;
    months.forEach((m, i) => {
      const v = r.v[el][view][m];
      const neg = v != null && Math.round(v * 10 ** dec) < 0;
      const st = heatStyle(ctx, r, m, v);
      h += `<td class='num ${i === 0 ? "sep" : ""} ${neg ? "neg" : ""} ${st ? "heat" : ""}' style='${st}'>${fmt(v, dec)}</td>`;
    });
    years.forEach((y, i) => {
      const v = r.y[el][view][y];
      h += `<td class='num ${i === 0 ? "sep" : ""} ${v != null && Math.round(v * 10 ** dec) < 0 ? "neg" : ""}'>${fmt(v, dec)}</td>`;
    });
    h += "</tr>";
  });
  h += "</tbody>";
  document.getElementById("tbl").innerHTML = h;
}

function setLevel(ctx, n) {
  state.collapsed = new Set(ctx.rows.filter(r => r.level >= n && r.children.length).map(r => r.code));
  syncLevelBtns(n);
  render(ctx);
}
function syncLevelBtns(n) {
  document.querySelectorAll("#levelBtns button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === n)));
}
function segButtons(boxId, entries, current, onPick) {
  const box = document.getElementById(boxId);
  entries.forEach(([k, label]) => {
    const b = document.createElement("button");
    b.className = "seg"; b.textContent = label; b.setAttribute("aria-pressed", String(k === current));
    b.onclick = () => { box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); onPick(k); };
    box.appendChild(b);
  });
}

function init() {
  if (!DATA) { document.getElementById("tbl").outerHTML = "<div class='empty'>尚無資料：請先執行 fetch_jolts.py 與 build_dashboard.py</div>"; return; }
  const ctx = prepare();
  const maxLv = Math.max(...ctx.rows.map(r => r.level));
  document.getElementById("meta").textContent =
    `資料來源：${DATA.source}｜最新月份 ${ctx.latest}｜擷取時間 ${DATA.fetched_at}` +
    (DATA.missing && DATA.missing.length ? `｜缺資料：${DATA.missing.join(", ")}` : "");
  renderCards(ctx);
  segButtons("elemBtns", DATA.elements.map(e => [e.code, e.zh]), state.el, k => { state.el = k; render(ctx); });
  segButtons("viewBtns", Object.entries(VIEWS), state.view, k => { state.view = k; render(ctx); });
  const lb = document.getElementById("levelBtns");
  for (let n = 0; n <= maxLv; n++) {
    const b = document.createElement("button");
    b.className = "seg"; b.dataset.n = n; b.textContent = `L${n} ${LEVEL_NAMES[n] || ""}`;
    b.onclick = () => setLevel(ctx, n);
    lb.appendChild(b);
  }
  document.getElementById("heat").onchange = e => { state.heat = e.target.checked; render(ctx); };
  document.getElementById("showZh").onchange = e => document.body.classList.toggle("hide-zh", !e.target.checked);
  document.getElementById("tbl").addEventListener("click", e => {
    const id = e.target.dataset && e.target.dataset.id;
    if (!id) return;
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    syncLevelBtns(-1);
    render(ctx);
  });
  setLevel(ctx, 2);
}
init();
</script>
</body>
</html>
