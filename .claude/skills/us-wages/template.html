<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美國平均時薪 MoM</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1f22; --muted: #6b6f76; --line: #e2e2dc; --line-strong: #c9c9c1;
  --head: #eeeee8; --accent: #2f5d8a; --neg: #2f6f9e;
  --hot: 214, 48, 40;    /* MoM above HEAT_CENTER */
  --cold: 45, 110, 200;  /* MoM below HEAT_CENTER */
  --edge: #b07a00;       /* near a rounding boundary */
  --rowhover: #f3f6fa;
  --ai-build: #fbe1df; --ai-risk: #dde9f8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --ink: #e6e6e3; --muted: #9a9ea6; --line: #2c3036; --line-strong: #3b4048;
    --head: #24282d; --accent: #8db8e0; --neg: #8cc4ef; --edge: #f0c050; --rowhover: #23282f;
    --ai-build: #4a2a2a; --ai-risk: #243650;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --ink: #e6e6e3; --muted: #9a9ea6; --line: #2c3036; --line-strong: #3b4048;
  --head: #24282d; --accent: #8db8e0; --neg: #8cc4ef; --edge: #f0c050; --rowhover: #23282f;
  --ai-build: #4a2a2a; --ai-risk: #243650;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1600px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 12.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; max-width: 1600px; margin: 0 auto; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > span { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
button.seg { border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); padding: 4px 10px;
  border-radius: 6px; font: inherit; font-size: 12.5px; cursor: pointer; }
button.seg:hover { border-color: var(--accent); }
button.seg[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
label.chk { font-size: 12.5px; display: flex; gap: 4px; align-items: center; cursor: pointer; }
.wrap { max-width: 1600px; margin: 0 auto 32px; padding: 0 16px; }
.scroller { overflow: auto; max-height: calc(100vh - 150px); border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); }
table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; min-width: 100%; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--head); font-weight: 600; font-size: 12.5px;
  border-bottom: 1px solid var(--line-strong); text-align: right; }
thead tr.grp th { top: 0; text-align: center; font-weight: 600; color: var(--muted); }
thead tr.cols th { top: 27px; }
th.name, td.name { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; border-right: 1px solid var(--line-strong); min-width: 300px; }
thead th.name { z-index: 3; background: var(--head); }
td.num { text-align: right; min-width: 60px; }
td.sep, th.sep { border-left: 1px solid var(--line-strong); }
tbody tr:hover td { background-color: var(--rowhover); }
tbody tr:hover td.heat { filter: brightness(0.97); }
td.neg { color: var(--neg); }
td.edge { text-decoration: underline dotted var(--edge) 2px; text-underline-offset: 3px; }
td.name.ai-build { background: var(--ai-build); }
td.name.ai-risk { background: var(--ai-risk); }
.lv0 td { font-weight: 700; border-top: 1px solid var(--line-strong); } .lv1 td { font-weight: 600; }
.caret { display: inline-block; width: 16px; text-align: center; cursor: pointer; color: var(--muted); user-select: none; }
.caret.leaf { cursor: default; }
.zh { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
.hide-zh .zh { display: none; }
th .p { color: var(--accent); font-weight: 700; margin-left: 2px; }
.legend { color: var(--muted); font-size: 12px; padding: 8px 2px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
.ramp { display: inline-block; width: 90px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 4px;
  background: linear-gradient(90deg, rgba(var(--cold),.65), rgba(var(--cold),0) 50%, rgba(var(--hot),0) 50%, rgba(var(--hot),.65)); outline: 1px solid var(--line); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 640px) { th.name, td.name { min-width: 190px; } .zh { display: none; } }
</style>
</head>
<body>
<header>
  <h1>美國平均時薪（AHE）產業別 MoM</h1>
  <div class="sub" id="meta"></div>
</header>
<div class="controls">
  <div class="group" id="levelBtns"><span>展開至</span></div>
  <div class="group" id="viewBtns"><span>數值</span></div>
  <div class="group">
    <label class="chk"><input type="checkbox" id="heat" checked> MoM 上色</label>
    <label class="chk"><input type="checkbox" id="edge" checked> 標示進位邊界</label>
    <label class="chk"><input type="checkbox" id="showAi" checked> AI 影響標示</label>
    <label class="chk"><input type="checkbox" id="showZh" checked> 中文名稱</label>
  </div>
</div>
<div class="wrap">
  <div class="scroller"><table id="tbl"></table></div>
  <div class="legend">
    <span id="heatLegend"></span>
    <span><u style="text-decoration:underline dotted var(--edge) 2px;text-underline-offset:3px">0.25</u> 兩位小數為 x.x5，官方 1 位小數取決於第三位，可能差一檔</span>
    <span><span style="color:var(--neg)">負數藍字</span></span>
    <span><span class="sw" style="background:var(--ai-build);outline:1px solid var(--line-strong)"></span>產業名稱淡紅：受惠 AI 建置</span>
    <span><span class="sw" style="background:var(--ai-risk);outline:1px solid var(--line-strong)"></span>產業名稱淡藍：易被 AI 取代</span>
    <span><b style="color:var(--accent)">P</b> 初值（preliminary），後續兩個月會修正</span>
    <span>點擊產業名稱前的 ▸ / ▾ 可個別展開或收合</span>
  </div>
</div>
<script>
const DATA = /*__AHE_DATA__*/null;

const VIEWS = {
  mom2: "MoM % (2位)", mom1: "MoM % (官方1位)", avg3: "3個月平均 MoM %", ann3: "3個月年化 %",
  yoy: "YoY %", cents: "MoM 變化 (¢)", level: "時薪 ($)",
};
const DEC = { mom2: 2, mom1: 1, avg3: 2, ann3: 1, yoy: 1, cents: 0, level: 2 };
const LEVEL_NAMES = ["民間總數", "部門", "超級產業", "細產業", "次細產業"];
const AI_TIP = { build: "受惠 AI 建置", risk: "易被 AI 取代" };
const state = { view: "mom2", heat: true, edge: true, ai: true, collapsed: new Set() };

// MoM color scale: red above HEAT_CENTER, blue below; deeper the further away, full depth at HEAT_FULL away.
const HEAT_CENTER = 0.3, HEAT_FULL = 0.5, HEAT_MAX_ALPHA = 0.65;
const HEAT_VIEWS = ["mom2", "mom1", "avg3"];

function ymPrev(ym, n = 1) {
  let [y, m] = ym.split("-").map(Number);
  m -= n; while (m <= 0) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, "0")}`;
}
const fmt = (v, d = 0) => {
  if (v == null || Number.isNaN(v)) return "";
  const r = Math.round(v * 10 ** d) / 10 ** d || 0;   // avoid "-0"
  return r.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const round1 = v => Math.round((v + Math.sign(v) * 1e-9) * 10) / 10;   // official 1-decimal, ties away from 0
// 2-decimal value prints as x.x5: the official 1-decimal figure hinges on the 3rd decimal (0.345 -> 0.3, 0.350 -> 0.4).
const nearEdge = v => { if (v == null) return false; const f = Math.abs(v) * 10 % 1; return f >= 0.45 - 1e-9 && f < 0.55 - 1e-9; };

function prepare() {
  const rows = DATA.rows;
  const byId = Object.fromEntries(rows.map(r => [r.id, r]));
  rows.forEach(r => { r.children = rows.filter(c => c.parent === r.id).map(c => c.id); });
  const allMonths = [...new Set(rows.flatMap(r => Object.keys(r.levels)))].sort();
  const months = allMonths.filter(m => m >= DATA.start).reverse();   // newest first
  const prelim = new Set(rows.flatMap(r => r.prelim || []));
  const latest = months[0];
  const firstYear = +(DATA.annual_from || DATA.start.slice(0, 4));
  const years = [];
  for (let y = +latest.slice(0, 4); y >= firstYear; y--) years.push(String(y));
  const pct = (a, b) => (a != null && b != null) ? (a / b - 1) * 100 : null;
  rows.forEach(r => {
    const L = r.levels;
    r.v = { mom2: {}, mom1: {}, avg3: {}, ann3: {}, yoy: {}, cents: {}, level: L };
    months.forEach(m => {
      const g = pct(L[m], L[ymPrev(m)]);
      if (g != null) { r.v.mom2[m] = g; r.v.mom1[m] = round1(g); r.v.cents[m] = (L[m] - L[ymPrev(m)]) * 100; }
      const r3 = L[m] != null && L[ymPrev(m, 3)] != null ? L[m] / L[ymPrev(m, 3)] : null;
      if (r3 != null) { r.v.avg3[m] = (r3 ** (1 / 3) - 1) * 100; r.v.ann3[m] = (r3 ** 4 - 1) * 100; }
      const y = pct(L[m], L[ymPrev(m, 12)]);
      if (y != null) r.v.yoy[m] = y;
    });
    r.ytd = {};
    years.forEach(y => {
      const last = Object.keys(L).filter(m => m.startsWith(y)).sort().pop();   // Dec, or latest month this year
      const g = last ? pct(L[last], L[`${+y - 1}-12`]) : null;
      if (g != null) r.ytd[y] = g;
    });
    r.latestLevel = L[latest];
    r.latestYoy = r.v.yoy[latest];
  });
  return { rows, byId, months, prelim, latest, years };
}

function heatStyle(v) {
  if (!state.heat || !HEAT_VIEWS.includes(state.view) || v == null) return "";
  const d = v - HEAT_CENTER;
  if (Math.abs(d) < 1e-9) return "";
  const a = (Math.min(Math.abs(d) / HEAT_FULL, 1) * HEAT_MAX_ALPHA).toFixed(2);
  return `background-color:rgba(var(${d > 0 ? "--hot" : "--cold"}),${a})`;
}

function isVisible(r, ctx) {
  let p = r.parent;
  while (p) { if (state.collapsed.has(p)) return false; p = ctx.byId[p].parent; }
  return true;
}

function render(ctx) {
  const { rows, months, prelim, years, latest } = ctx;
  const showYtd = state.view !== "level" && state.view !== "cents";
  const dec = DEC[state.view];
  let h = "<thead><tr class='grp'><th class='name'></th><th colspan='2'>最新 " + latest.replace("-", "/") + "</th>";
  h += `<th class='sep' colspan='${months.length}'>${VIEWS[state.view]}</th>`;
  if (showYtd) h += `<th class='sep' colspan='${years.length}'>年度 % (12 月對前一年 12 月)</th>`;
  h += "</tr><tr class='cols'><th class='name'>產業</th><th>時薪 ($)</th><th>YoY %</th>";
  months.forEach((m, i) => {
    h += `<th class='${i === 0 ? "sep" : ""}'>${m.replace("-", "/")}${prelim.has(m) ? "<span class='p' title='preliminary 初值'>P</span>" : ""}</th>`;
  });
  if (showYtd) years.forEach((y, i) => {
    const ytd = y === latest.slice(0, 4) && latest.slice(5) !== "12";
    h += `<th class='${i === 0 ? "sep" : ""}'>${y}${ytd ? " YTD" : ""}</th>`;
  });
  h += "</tr></thead><tbody>";
  rows.forEach(r => {
    if (!isVisible(r, ctx)) return;
    const caret = r.children.length ? `<span class='caret' data-id='${r.id}'>${state.collapsed.has(r.id) ? "▸" : "▾"}</span>`
                                    : "<span class='caret leaf'></span>";
    const ai = state.ai && r.ai ? ` ai-${r.ai}` : "";
    h += `<tr class='lv${r.level}' title='${r.id}'>`;
    h += `<td class='name${ai}' style='padding-left:${8 + r.level * 18}px'${ai ? ` title='${AI_TIP[r.ai]}'` : ""}>${caret}${r.en}<span class='zh'>${r.zh}</span></td>`;
    h += `<td class='num'>${fmt(r.latestLevel, 2)}</td>`;
    h += `<td class='num ${r.latestYoy != null && round1(r.latestYoy) < 0 ? "neg" : ""}'>${fmt(r.latestYoy, 1)}</td>`;
    months.forEach((m, i) => {
      const v = r.v[state.view][m];
      const neg = v != null && Math.round(v * 10 ** dec) < 0;   // a value shown as 0 stays black
      const st = heatStyle(v);
      const edge = state.edge && state.view === "mom2" && nearEdge(v);
      h += `<td class='num ${i === 0 ? "sep" : ""} ${neg ? "neg" : ""} ${st ? "heat" : ""} ${edge ? "edge" : ""}' style='${st}'>${fmt(v, dec)}</td>`;
    });
    if (showYtd) years.forEach((y, i) => {
      const v = r.ytd[y];
      h += `<td class='num ${i === 0 ? "sep" : ""} ${v != null && round1(v) < 0 ? "neg" : ""}'>${fmt(v, 1)}</td>`;
    });
    h += "</tr>";
  });
  h += "</tbody>";
  document.getElementById("tbl").innerHTML = h;
}

function setLevel(ctx, n) {
  state.collapsed = new Set(ctx.rows.filter(r => r.level >= n && r.children.length).map(r => r.id));
  syncLevelBtns(n);
  render(ctx);
}
function syncLevelBtns(n) {
  document.querySelectorAll("#levelBtns button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === n)));
}

function init() {
  if (!DATA) { document.getElementById("tbl").outerHTML = "<div class='empty'>尚無資料：請先執行 fetch_ahe.py 與 build_dashboard.py</div>"; return; }
  const ctx = prepare();
  const maxLv = Math.max(...ctx.rows.map(r => r.level));
  const tot = ctx.rows[0];
  document.getElementById("meta").textContent =
    `資料來源：${DATA.source}｜最新月份 ${ctx.latest}：民間平均時薪 $${fmt(tot.latestLevel, 2)}，` +
    `MoM ${fmt(tot.v.mom2[ctx.latest], 2)}%（官方 ${fmt(tot.v.mom1[ctx.latest], 1)}%），YoY ${fmt(tot.latestYoy, 1)}%｜擷取時間 ${DATA.fetched_at}` +
    (DATA.missing && DATA.missing.length ? `｜缺資料：${DATA.missing.join(", ")}` : "");
  document.getElementById("heatLegend").innerHTML =
    `MoM 上色：${fmt(HEAT_CENTER - HEAT_FULL, 2)}%<span class='ramp'></span>${fmt(HEAT_CENTER + HEAT_FULL, 2)}%，` +
    `以 ${fmt(HEAT_CENTER, 2)}% 為中心（高於紅、低於藍）`;
  const lb = document.getElementById("levelBtns");
  for (let n = 0; n <= maxLv; n++) {
    const b = document.createElement("button");
    b.className = "seg"; b.dataset.n = n; b.textContent = `L${n} ${LEVEL_NAMES[n] || ""}`;
    b.onclick = () => setLevel(ctx, n);
    lb.appendChild(b);
  }
  const vb = document.getElementById("viewBtns");
  Object.entries(VIEWS).forEach(([k, label]) => {
    const b = document.createElement("button");
    b.className = "seg"; b.textContent = label; b.setAttribute("aria-pressed", String(k === state.view));
    b.onclick = () => { state.view = k; vb.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(ctx); };
    vb.appendChild(b);
  });
  document.getElementById("heat").onchange = e => { state.heat = e.target.checked; render(ctx); };
  document.getElementById("edge").onchange = e => { state.edge = e.target.checked; render(ctx); };
  document.getElementById("showAi").onchange = e => { state.ai = e.target.checked; render(ctx); };
  document.getElementById("showZh").onchange = e => document.body.classList.toggle("hide-zh", !e.target.checked);
  document.getElementById("tbl").addEventListener("click", e => {
    const id = e.target.dataset && e.target.dataset.id;
    if (!id) return;
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    syncLevelBtns(-1);
    render(ctx);
  });
  setLevel(ctx, 2);
}
init();
</script>
</body>
</html>
